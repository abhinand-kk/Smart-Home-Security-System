services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: smartguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpassword2026}
      POSTGRES_DB: ${POSTGRES_DB:-smartguard_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartuser} -d ${POSTGRES_DB:-smartguard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Python Flask API Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-smartguard-secret-key-college-2026}
      ESP32_API_KEY: ${ESP32_API_KEY:-smartguard-esp32-secret-key-2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartuser}:${POSTGRES_PASSWORD:-smartpassword2026}@db:5432/${POSTGRES_DB:-smartguard_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-45}
    ports:
      - "5000:5000"

volumes:
  # Persistent volume for PostgreSQL database
  postgres_data:
    driver: local
